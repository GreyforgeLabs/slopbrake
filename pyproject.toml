[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopbrake"
version = "0.2.0"
description = "Brakes for the software factory: checks, a fresh-context reviewer and one-way-door triage for coding agents, proven to bite"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Greyforge Labs" }]
keywords = ["ai-agents", "claude-code", "coding-agents", "mutation-testing", "code-review", "guardrails", "tdd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/GreyforgeLabs/slopbrake"
Rules = "https://github.com/GreyforgeLabs/slopbrake/blob/main/docs/RULES.md"

[project.scripts]
slopbrake = "slopbrake.cli:main"
slopbrake-hook = "slopbrake.hooks:main"

[tool.setuptools]
packages = ["slopbrake"]
include-package-data = true
