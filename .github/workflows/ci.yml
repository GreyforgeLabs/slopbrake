name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: scripts/check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$GITLEAKS_VERSION" -R gitleaks/gitleaks -p "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O - | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --verbose
