# Layer 1 in CI: the same umbrella gate agents run locally (scripts/check).
# On pull requests the pr stage also checks the PR body's Door and Blast Radius.
# slopbrake init fills the package-manager setup and install steps for this repo.
name: check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [@DEFAULT_BRANCH@]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
@CI_SETUP@
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: @CI_INSTALL@
      - run: scripts/check
