# Door floor for scripts/slopbrake/door_classify.py (rule G2).
# A change matching any rule is a one-way door: human review required, never auto-merged.
# Agents may raise a door to one-way; they may never lower it. Globs are gitignore-style
# (`**/` spans directories); one_way globs ignore case (src/Auth/ matches **/auth/**),
# ignore lists do not. content_patterns are regexes matched against added lines
# (`(?i)` makes one case-insensitive); comment-only lines (# or //) are not scanned.
# Supported syntax: `key: value` and `key:` followed by `- item` lines. Each key appears once:
# add repo rules to the existing lists. A PR is classified with the union of its own rules
# and the base branch's rules (ignore lists and exemptions come from the base only).

one_way:
  # data and schema
  - "**/migrations/**"
  - "**/alembic/versions/**"
  - "**/migrate/**"
  - "**/*.sql"
  - "**/schema.prisma"
  - "**/schema.rb"
  - "**/db/schema.*"
  # infrastructure, deploy and CI
  - "infra/**"
  - ".github/**"
  - "**/CODEOWNERS"
  - ".gitlab-ci.yml"
  - "**/*.tf"
  - "**/Dockerfile*"
  - "**/docker-compose*.y*ml"
  - "**/k8s/**"
  - "**/helm/**"
  - "**/wrangler.toml"
  - "**/vercel.json"
  # secrets and environment
  - "**/.env"
  - "**/.env.*"
  # auth, money, outbound communication, public contracts
  - "**/auth/**"
  - "**/*auth/**"  # oauth/, user-auth/; authors/ and authoring/ stay two-way
  - "**/auth_*/**"
  - "**/auth-*/**"
  - "**/auth.*"
  - "**/middleware/**/session*.*"
  - "**/billing/**"
  - "**/payments/**"
  - "**/stripe*/**"
  - "**/email/**"
  - "**/notifications/**"
  - "**/openapi.*"
  # the auto-merge decider and the gate itself: the operator reviews these (G3)
  - ".claude/door-rules.yml"
  - ".claude/slopbrake.json"
  - ".claude/settings.json"
  - ".claude/hooks/**"
  - ".claude/agents/**"
  - ".claude/skills/**"
  - "**/CLAUDE.md"
  - "CODING_STANDARDS.md"
  - "scripts/check"
  - "scripts/smoke.sh"
  - "scripts/slopbrake/**"
  - ".githooks/**"
  - "stryker.config.json"
  - "eslint-rules/**"
  - "eslint.config.*"
  - ".dependency-cruiser.cjs"
  # configs that drive the gate's stages (package.json scripts and pyproject [tool.*] are content rules below)
  - "**/ruff.toml"
  - "**/.ruff.toml"
  - "**/pytest.ini"
  - "**/tox.ini"
  - "**/setup.cfg"
  - "**/mypy.ini"
  - "**/.mypy.ini"
  - "**/pyrightconfig.json"
  - "**/vitest.config.*"
  - "**/jest.config.*"
  - "**/tsconfig*.json"

content_patterns:
  - "(?i)\\bdrop\\s+(table|column|schema|database)\\b"
  - "(?i)\\balter\\s+table\\b.*\\bdrop\\b"
  # identifiers may be quoted: "User", `users`, [dbo].[users]; lowercase prose like "delete from the cache" is not SQL
  - "\\bDELETE\\s+FROM\\b"
  - "(?i)\\bdelete\\s+from\\s+(?!(the|a|an|this|that|it|its|our|your|their)\\b)[\\w\"`\\[]"
  - "(?i)\\btruncate\\s+table\\b"
  - "\\bTRUNCATE\\s+(?![=(])\\S"
  - "(?i)\\btruncate\\s+([\\w.]+|\"[^\"]+\"|`[^`]+`|\\[[^\\]]+\\])\\s*(;|['\"`]\\s*([,)]|$))"
  - "\\bdrop_all\\("
  - "\\bop\\.drop_\\w+\\("
  - "sendEmail\\("
  # the gate's own scripts and tool tables
  - "^\\s*\"(lint|test|typecheck|smoke|check)\"\\s*:"
  - "^\\[tool\\.(ruff|pytest|mypy|pyright|coverage)"
  # deleting files or directories at runtime (user data paths); removing only build outputs is not
  - "\\brm(?!(?:\\s+(?:-[\\w-]*|(?:\\./)?(?:dist|build|node_modules|coverage|\\.cache|tmp|out|\\.next)/?))+\\s*(?:[;|&\"'`)]|$))(?=[^;|&\\n]*\\s-([a-zA-Z]*[rR]|-recursive\\b))(?=[^;|&\\n]*\\s-([a-zA-Z]*f|-force\\b))"
  - "[\"']rm[\"']\\s*,\\s*[\"']-[a-zA-Z]*[rRf]"
  - "\\brmtree\\("
  - "os\\.(remove|unlink|rmdir)\\("
  - "\\.(unlink|rmdir)\\("
  - "fs\\.(rm|rmSync|unlink|unlinkSync|rmdir|rmdirSync)\\("

# Paths that are not classified at all: templates without real values, and docs.
ignore:
  - "docs/**"
  - "**/.env.example"
  - "**/.env.sample"
  - "**/.env.template"

# Paths whose added lines are not content-scanned (fixtures quoting SQL, for example).
content_ignore:
  - "tests/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test_*.py"
  - "**/conftest.py"
  - "docs/**"
  - "**/*.md"

default: two_way
